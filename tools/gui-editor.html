<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Horizon GUI 编辑器 · 480×270</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.5 "Segoe UI","Microsoft YaHei",sans-serif; background:#16181d; color:#d9dee7;
         display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  header { display:flex; align-items:center; gap:8px; padding:8px 12px; background:#1e2129;
           border-bottom:1px solid #2b303b; flex:0 0 auto; flex-wrap:wrap; }
  header h1 { font-size:14px; margin:0 10px 0 0; font-weight:600; color:#eef2f8; letter-spacing:.5px; }
  header .sep { width:1px; height:20px; background:#333a47; margin:0 4px; }
  button, select, input[type=text], input[type=number] { font:inherit; color:#d9dee7; background:#262b35;
        border:1px solid #39414f; border-radius:4px; padding:3px 8px; }
  button:hover { background:#2f3642; }
  button.primary { background:#2c5c9e; border-color:#3d78c9; }
  button.primary:hover { background:#356cb8; }
  input[type=color] { width:34px; height:24px; padding:0; border:1px solid #39414f; background:#262b35; border-radius:4px; }
  label.chk { display:flex; align-items:center; gap:4px; user-select:none; }
  main { flex:1 1 auto; display:flex; min-height:0; }
  #palette, #inspector { background:#1b1e25; border-right:1px solid #2b303b; overflow:auto; padding:10px; }
  #palette { width:172px; flex:0 0 172px; }
  #inspector { width:270px; flex:0 0 270px; border-right:none; border-left:1px solid #2b303b; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:#8b95a7; margin:14px 0 6px; }
  h2:first-child { margin-top:0; }
  .add { display:block; width:100%; text-align:left; margin-bottom:5px; }
  #stage { flex:1 1 auto; overflow:auto; display:flex; align-items:center; justify-content:center;
           background:
             linear-gradient(45deg,#191c22 25%,transparent 25%,transparent 75%,#191c22 75%),
             linear-gradient(45deg,#191c22 25%,transparent 25%,transparent 75%,#191c22 75%),
             #131519;
           background-size:16px 16px; background-position:0 0,8px 8px; }
  #wrap { position:relative; box-shadow:0 0 0 1px #333a47, 0 12px 40px rgba(0,0,0,.5); }
  canvas { display:block; image-rendering:pixelated; cursor:default; }
  #hud { position:absolute; left:0; top:0; pointer-events:none; font:11px/1.4 Consolas,monospace;
         color:#a9e2ff; text-shadow:0 1px 2px #000; padding:2px 4px; }
  #inspector .empty { color:#6b7484; margin-top:6px; }
  .row { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  .row > span { width:62px; flex:0 0 62px; color:#98a2b3; }
  .row input[type=number] { width:64px; }
  .row input[type=text] { flex:1 1 auto; min-width:0; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  #layers { list-style:none; margin:0; padding:0; }
  #layers li { display:flex; align-items:center; gap:6px; padding:4px 6px; border-radius:4px; cursor:pointer; }
  #layers li:hover { background:#232833; }
  #layers li.sel { background:#2c5c9e; }
  #layers .tag { font-size:10px; color:#0e1116; background:#8b95a7; border-radius:3px; padding:0 4px; }
  #layers li.sel .tag { background:#dbe6f5; }
  #layers .nm { flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #layers .z { display:flex; gap:2px; }
  #layers .z button { padding:0 4px; font-size:11px; }
  dialog { border:1px solid #39414f; border-radius:8px; background:#1b1e25; color:#d9dee7; width:min(760px,92vw); }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog textarea { width:100%; height:340px; font:12px/1.5 Consolas,monospace; background:#0f1116;
        color:#cfe3ff; border:1px solid #333a47; border-radius:6px; padding:8px; resize:vertical; }
  dialog .foot { display:flex; justify-content:flex-end; gap:8px; margin-top:10px; }
  .hint { color:#6b7484; font-size:11px; line-height:1.6; }
  kbd { background:#262b35; border:1px solid #39414f; border-bottom-width:2px; border-radius:3px; padding:0 4px; font-size:11px; }
</style>
</head>
<body>
<header>
  <h1>Horizon GUI 编辑器</h1>
  <button id="undo" title="Ctrl+Z">撤销</button>
  <button id="redo" title="Ctrl+Shift+Z">重做</button>
  <span class="sep"></span>
  <label class="chk">缩放
    <select id="zoom">
      <option value="1">1×</option>
      <option value="2" selected>2×</option>
      <option value="3">3×</option>
    </select>
  </label>
  <label class="chk"><input type="checkbox" id="snap" checked> 吸附</label>
  <label class="chk"><input type="checkbox" id="grid" checked> 网格</label>
  <span class="sep"></span>
  <button id="png">导出 PNG</button>
  <button id="rust" class="primary">导出 Rust</button>
  <button id="save">保存 JSON</button>
  <button id="load">打开 JSON</button>
  <button id="clear">清空</button>
  <input type="file" id="file" accept=".json,application/json" hidden>
</header>

<main>
  <aside id="palette">
    <h2>添加控件</h2>
    <button class="add" data-add="button">按钮</button>
    <button class="add" data-add="label">文字</button>
    <button class="add" data-add="panel">面板 / 底</button>
    <button class="add" data-add="swatch">色块</button>
    <button class="add" data-add="board">画板</button>
    <button class="add" data-add="icon">图标格</button>
    <h2>操作</h2>
    <div class="hint">
      拖拽移动，拖角缩放<br>
      方向键 1px／Shift 10px<br>
      <kbd>Ctrl</kbd>+<kbd>Z</kbd> 撤销<br>
      <kbd>Ctrl</kbd>+<kbd>D</kbd> 复制<br>
      <kbd>Del</kbd> 删除，<kbd>Esc</kbd> 取消<br>
      拖动自动对齐并吸附
    </div>
  </aside>

  <section id="stage">
    <div id="wrap">
      <canvas id="cv"></canvas>
      <div id="hud"></div>
    </div>
  </section>

  <aside id="inspector">
    <h2>属性</h2>
    <div id="props"><div class="empty">未选中控件</div></div>
    <h2>图层（上→下）</h2>
    <ul id="layers"></ul>
  </aside>
</main>

<dialog id="codeDlg">
  <h2 style="margin-top:0">导出的 Rust 代码</h2>
  <textarea id="code" spellcheck="false"></textarea>
  <div class="foot">
    <button id="copy">复制</button>
    <button id="closeDlg">关闭</button>
  </div>
</dialog>

<script>
"use strict";
const W = 480, H = 270, KEY = "horizon-gui-editor-v1";
const TYPES = {
  panel:  { w: 200, h: 120, color:"#101010", border:"#303030", textColor:"#FFFFFF", text:"",     size:16, align:"left" },
  button: { w: 84,  h: 22,  color:"#8B8B8B", border:"#E6E6E6", textColor:"#FFFFFF", text:"按钮", size:16, align:"center" },
  label:  { w: 60,  h: 18,  color:"#00000000", border:"#00000000", textColor:"#FFFFFF", text:"文字", size:16, align:"left" },
  swatch: { w: 20,  h: 20,  color:"#E03C3C", border:"#FFFFFF", textColor:"#FFFFFF", text:"", size:16, align:"left" },
  board:  { w: 160, h: 160, color:"#1E1E1E", border:"#A0A0A0", textColor:"#FFFFFF", text:"", size:16, align:"left" },
  icon:   { w: 28,  h: 28,  color:"#202020", border:"#808080", textColor:"#9AA4B2", text:"图标", size:8, align:"center" }
};
const NAMES = { panel:"面板", button:"按钮", label:"文字", swatch:"色块", board:"画板", icon:"图标" };

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const hud = document.getElementById("hud");
const props = document.getElementById("props");
const layers = document.getElementById("layers");

let state = { elements: [], selected: null, zoom: 2, snap: true, grid: true, bg: false, seq: 1 };
let history = [], future = [], guides = [];
let drag = null;

/* ---------- 基本工具 ---------- */
const uid = () => "e" + (state.seq++);
const clone = o => JSON.parse(JSON.stringify(o));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const byId = id => state.elements.find(e => e.id === id);

function rgba(hex, alphaOverride) {
  if (!hex || hex === "transparent") return null;
  let h = hex.replace("#", "");
  if (h.length === 3) h = h.split("").map(c => c + c).join("");
  if (h.length === 8) {
    const a = parseInt(h.slice(0,2),16), r = parseInt(h.slice(2,4),16), g = parseInt(h.slice(4,6),16), b = parseInt(h.slice(6,8),16);
    if (a === 0) return null;
    return "rgba(" + r + "," + g + "," + b + "," + (a/255).toFixed(3) + ")";
  }
  if (h.length !== 6) return null;
  return "rgba(" + parseInt(h.slice(0,2),16) + "," + parseInt(h.slice(2,4),16) + "," + parseInt(h.slice(4,6),16) + "," + (alphaOverride == null ? 1 : alphaOverride) + ")";
}
function argb(hex) {
  let h = (hex || "#000000").replace("#", "");
  if (h.length === 3) h = h.split("").map(c => c + c).join("");
  if (h.length === 8) return "0x" + h.toUpperCase();
  return "0xFF" + h.toUpperCase();
}
function num(v, d) { const n = Number(v); return Number.isFinite(n) ? n : d; }

/* ---------- 绘制 ---------- */
function drawScene(g, scale, opts) {
  opts = opts || {};
  g.save();
  g.setTransform(scale, 0, 0, scale, 0, 0);
  g.clearRect(0, 0, W, H);
  if (state.bg) { g.fillStyle = "#101010"; g.fillRect(0, 0, W, H); }
  if (opts.grid) {
    g.lineWidth = 1 / scale;
    g.strokeStyle = "rgba(255,255,255,0.05)";
    g.beginPath();
    for (let x = 0; x <= W; x += 8) { g.moveTo(x + .5/scale, 0); g.lineTo(x + .5/scale, H); }
    for (let y = 0; y <= H; y += 8) { g.moveTo(0, y + .5/scale); g.lineTo(W, y + .5/scale); }
    g.stroke();
  }
  for (const el of state.elements) drawElement(g, el);
  if (opts.selection && state.selected) drawSelection(g, byId(state.selected), scale);
  if (opts.guides) drawGuides(g, scale);
  g.restore();
}

function drawElement(g, el) {
  const fill = rgba(el.color), border = rgba(el.border);
  if (el.type === "board") {
    if (fill) { g.fillStyle = fill; g.fillRect(el.x, el.y, el.w, el.h); }
    g.strokeStyle = "rgba(255,255,255,0.14)";
    g.lineWidth = 1;
    g.beginPath();
    for (let i = 1; i < 32; i++) {
      const px = el.x + Math.round(el.w * i / 32) + .5, py = el.y + Math.round(el.h * i / 32) + .5;
      g.moveTo(px, el.y); g.lineTo(px, el.y + el.h);
      g.moveTo(el.x, py); g.lineTo(el.x + el.w, py);
    }
    g.stroke();
  } else if (el.type === "icon") {
    if (fill) { g.fillStyle = fill; g.fillRect(el.x, el.y, el.w, el.h); }
    if (border) { g.strokeStyle = border; g.lineWidth = 1; g.strokeRect(el.x + .5, el.y + .5, el.w - 1, el.h - 1); }
    const q = Math.max(8, Math.min(el.w, el.h) * 0.42);
    g.fillStyle = rgba(el.textColor) || "#9AA4B2";
    g.font = q + "px monospace";
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText("?", el.x + el.w / 2, el.y + el.h / 2 + 0.5);
    return;
  } else {
    if (fill) { g.fillStyle = fill; g.fillRect(el.x, el.y, el.w, el.h); }
  }

  if (el.type === "button") {
    if (fill) { g.fillStyle = fill; g.fillRect(el.x, el.y, el.w, el.h); }
    g.fillStyle = "rgba(255,255,255,0.55)";
    g.fillRect(el.x, el.y, el.w, 1); g.fillRect(el.x, el.y, 1, el.h);
    g.fillStyle = "rgba(0,0,0,0.45)";
    g.fillRect(el.x, el.y + el.h - 1, el.w, 1); g.fillRect(el.x + el.w - 1, el.y, 1, el.h);
    if (border) { g.strokeStyle = border; g.lineWidth = 1; g.strokeRect(el.x + .5, el.y + .5, el.w - 1, el.h - 1); }
  } else if (border) {
    g.strokeStyle = border; g.lineWidth = 1;
    g.strokeRect(el.x + .5, el.y + .5, el.w - 1, el.h - 1);
  }

  if (el.text) {
    const color = rgba(el.textColor) || "#FFFFFF";
    g.fillStyle = color;
    g.font = el.size + 'px "Microsoft YaHei", monospace';
    g.textBaseline = "middle";
    const pad = 2;
    let x = el.x + pad, align = "left";
    if (el.type === "button" || el.align === "center") { x = el.x + el.w / 2; align = "center"; }
    else if (el.align === "right") { x = el.x + el.w - pad; align = "right"; }
    g.textAlign = align;
    const y = el.y + el.h / 2 + 1;
    g.fillStyle = "rgba(0,0,0,0.55)";
    g.fillText(el.text, x + 1, y + 1);
    g.fillStyle = color;
    g.fillText(el.text, x, y);
  }
}

function drawSelection(g, el, scale) {
  if (!el) return;
  g.save();
  g.strokeStyle = "#3FA9F5";
  g.lineWidth = 1 / scale;
  g.setLineDash([4 / scale, 3 / scale]);
  g.strokeRect(el.x + .5/scale, el.y + .5/scale, el.w, el.h);
  g.setLineDash([]);
  const hs = 6 / scale, hs2 = hs / 2;
  g.fillStyle = "#FFFFFF";
  g.strokeStyle = "#1B6FB0";
  for (const [hx, hy] of handles(el)) {
    g.fillRect(hx - hs2, hy - hs2, hs, hs);
    g.strokeRect(hx - hs2, hy - hs2, hs, hs);
  }
  const label = Math.round(el.w) + "×" + Math.round(el.h);
  g.font = (11 / scale) + "px Consolas,monospace";
  g.textBaseline = "bottom";
  g.textAlign = "left";
  const tw = g.measureText(label).width;
  g.fillStyle = "rgba(16,18,24,0.85)";
  g.fillRect(el.x, el.y - 15 / scale, tw + 6 / scale, 14 / scale);
  g.fillStyle = "#9ED8FF";
  g.fillText(label, el.x + 3 / scale, el.y - 3 / scale);
  g.restore();
}

function drawGuides(g, scale) {
  if (!guides.length) return;
  g.save();
  g.strokeStyle = "#FF7AC6";
  g.lineWidth = 1 / scale;
  g.beginPath();
  for (const gd of guides) {
    if (gd.axis === "x") { g.moveTo(gd.v + .5/scale, 0); g.lineTo(gd.v + .5/scale, H); }
    else { g.moveTo(0, gd.v + .5/scale); g.lineTo(W, gd.v + .5/scale); }
  }
  g.stroke();
  g.restore();
}

function handles(el) {
  const { x, y, w, h } = el;
  return [[x, y], [x + w/2, y], [x + w, y], [x + w, y + h/2], [x + w, y + h], [x + w/2, y + h], [x, y + h], [x, y + h/2]];
}
const HANDLE_NAMES = ["nw","n","ne","e","se","s","sw","w"];

/* ---------- 尺寸/缩放 ---------- */
function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const z = state.zoom;
  cv.width = Math.round(W * z * dpr);
  cv.height = Math.round(H * z * dpr);
  cv.style.width = (W * z) + "px";
  cv.style.height = (H * z) + "px";
  cv.dataset.scale = String(z * dpr);
  render();
}
function render(hint) {
  const scale = Number(cv.dataset.scale) || state.zoom;
  drawScene(ctx, scale, { grid: state.grid, selection: true, guides: true });
  hud.textContent = hint || "";
}

/* ---------- 选中 / 拖拽 ---------- */
function pointAt(ev) {
  const r = cv.getBoundingClientRect();
  return [ (ev.clientX - r.left) / state.zoom, (ev.clientY - r.top) / state.zoom ];
}
function hitHandle(el, px, py) {
  if (!el) return null;
  const tol = 6 / state.zoom;
  const hs = handles(el);
  for (let i = 0; i < hs.length; i++) {
    if (Math.abs(px - hs[i][0]) <= tol && Math.abs(py - hs[i][1]) <= tol) return HANDLE_NAMES[i];
  }
  return null;
}
function hitElement(px, py) {
  for (let i = state.elements.length - 1; i >= 0; i--) {
    const el = state.elements[i];
    if (px >= el.x && px <= el.x + el.w && py >= el.y && py <= el.y + el.h) return el;
  }
  return null;
}
function snapshot() {
  history.push(JSON.stringify(state));
  if (history.length > 80) history.shift();
  future.length = 0;
}

cv.addEventListener("pointerdown", ev => {
  try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
  const [px, py] = pointAt(ev);
  const sel = byId(state.selected);
  const h = hitHandle(sel, px, py);
  if (h) { snapshot(); drag = { mode: "resize", dir: h, start: [px, py], orig: clone(sel) }; return; }
  const el = hitElement(px, py);
  if (el) {
    select(el.id);
    snapshot();
    drag = { mode: "move", start: [px, py], orig: clone(el), el: el.id };
  } else {
    select(null);
  }
});

cv.addEventListener("pointermove", ev => {
  const [px, py] = pointAt(ev);
  if (!drag) {
    const sel = byId(state.selected);
    const h = hitHandle(sel, px, py);
    cv.style.cursor = h ? ({nw:"nwse-resize",se:"nwse-resize",ne:"nesw-resize",sw:"nesw-resize",n:"ns-resize",s:"ns-resize",e:"ew-resize",w:"ew-resize"}[h]) : (hitElement(px, py) ? "move" : "default");
    return;
  }
  const el = drag.mode === "resize" ? byId(state.selected) : byId(drag.el);
  if (!el) return;
  const dx = px - drag.start[0], dy = py - drag.start[1];
  if (drag.mode === "move") {
    let nx = Math.round(drag.orig.x + dx), ny = Math.round(drag.orig.y + dy);
    let hint = "";
    if (state.snap) {
      const s = snapEdges(el, nx, ny, drag.orig);
      nx = s.x; ny = s.y; guides = s.guides; hint = s.hint;
    } else guides = [];
    el.x = clamp(nx, -el.w + 2, W - 2);
    el.y = clamp(ny, -el.h + 2, H - 2);
    render("x " + Math.round(el.x) + "  y " + Math.round(el.y) + (hint ? "   " + hint : ""));
  } else {
    const o = drag.orig;
    let x = o.x, y = o.y, w = o.w, h = o.h;
    const dir = drag.dir;
    if (dir.includes("w")) { x = Math.round(o.x + dx); w = o.w - (x - o.x); }
    if (dir.includes("e")) { w = Math.round(o.w + dx); }
    if (dir.includes("n")) { y = Math.round(o.y + dy); h = o.h - (y - o.y); }
    if (dir.includes("s")) { h = Math.round(o.h + dy); }
    if (w < 4) { w = 4; if (dir.includes("w")) x = o.x + o.w - 4; }
    if (h < 4) { h = 4; if (dir.includes("n")) y = o.y + o.h - 4; }
    if (state.snap) {
      w = Math.round(w); h = Math.round(h); x = Math.round(x); y = Math.round(y);
    }
    el.x = x; el.y = y; el.w = w; el.h = h;
    render(Math.round(el.w) + "×" + Math.round(el.h));
  }
  refreshProps(false);
  refreshLayers(false);
});

cv.addEventListener("pointerup", () => { drag = null; guides = []; render(); persist(); });

function snapEdges(el, nx, ny, orig) {
  const tol = 3 / state.zoom > 3 ? 3 : 3;
  const xs = [0, W/2, W], ys = [0, H/2, H];
  for (const o of state.elements) {
    if (o.id === el.id) continue;
    xs.push(o.x, o.x + o.w/2, o.x + o.w);
    ys.push(o.y, o.y + o.h/2, o.y + o.h);
  }
  const edgesX = [ [nx, 0], [nx + el.w/2, el.w/2], [nx + el.w, el.w] ];
  const edgesY = [ [ny, 0], [ny + el.h/2, el.h/2], [ny + el.h, el.h] ];
  let bestX = null, bestY = null, gx = [], gy = [];
  for (const t of xs) for (const [v, off] of edgesX) {
    const d = t - v;
    if (Math.abs(d) <= tol && (!bestX || Math.abs(d) < Math.abs(bestX.d))) { bestX = { d, t }; }
  }
  for (const t of ys) for (const [v, off] of edgesY) {
    const d = t - v;
    if (Math.abs(d) <= tol && (!bestY || Math.abs(d) < Math.abs(bestY.d))) { bestY = { d, t }; }
  }
  if (bestX) { nx += bestX.d; gx = [{ axis: "x", v: bestX.t }]; }
  if (bestY) { ny += bestY.d; gy = [{ axis: "y", v: bestY.t }]; }
  return { x: nx, y: ny, guides: gx.concat(gy), hint: bestX || bestY ? "对齐" : "" };
}

/* ---------- 属性面板 ---------- */
function select(id) {
  state.selected = id;
  refreshProps(true);
  refreshLayers(true);
  render();
}

function field(label, inner) {
  const row = document.createElement("div");
  row.className = "row";
  const sp = document.createElement("span");
  sp.textContent = label;
  row.append(sp, inner);
  return row;
}
function inputNum(value, onInput, step) {
  const i = document.createElement("input");
  i.type = "number"; i.step = step || 1; i.value = Math.round(value);
  i.addEventListener("input", () => onInput(num(i.value, 0)));
  return i;
}
function inputText(value, onInput) {
  const i = document.createElement("input");
  i.type = "text"; i.value = value || "";
  i.addEventListener("input", () => onInput(i.value));
  return i;
}
function inputColor(value, onInput) {
  const i = document.createElement("input");
  i.type = "color";
  i.value = /^#[0-9a-f]{6}$/i.test(value || "") ? value : "#000000";
  i.addEventListener("input", () => onInput(i.value));
  return i;
}

function refreshProps(rebuild) {
  const el = byId(state.selected);
  if (!el) { props.innerHTML = '<div class="empty">未选中控件</div>'; return; }
  if (!rebuild && props.contains(document.activeElement)) return; // 正在输入时不重建
  props.textContent = "";
  const name = inputText(el.name || "", v => { el.name = v; persist(); });
  const nameRow = field("名称", name);
  props.append(nameRow);

  const xy = document.createElement("div");
  xy.className = "row2";
  const wr = (label, inp) => { const d = document.createElement("div"); d.className = "row"; const s = document.createElement("span"); s.textContent = label; s.style.width = "20px"; d.append(s, inp); return d; };
  xy.append(
    wr("X", inputNum(el.x, v => { el.x = v; render(); persist(); })),
    wr("Y", inputNum(el.y, v => { el.y = v; render(); persist(); })),
    wr("宽", inputNum(el.w, v => { el.w = Math.max(2, v); render(); persist(); })),
    wr("高", inputNum(el.h, v => { el.h = Math.max(2, v); render(); persist(); }))
  );
  props.append(xy);

  if (el.type !== "swatch" && el.type !== "board" && el.type !== "icon") {
    const t = inputText(el.text, v => { el.text = v; render(); refreshLayers(false); persist(); });
    props.append(field("文字", t));
  }
  if (el.type === "label" || el.type === "button" || el.type === "icon") {
    const s = document.createElement("select");
    for (const v of [8, 12, 16, 24]) {
      const o = document.createElement("option"); o.value = v; o.textContent = v + " px";
      if (v === el.size) o.selected = true;
      s.append(o);
    }
    s.addEventListener("change", () => { el.size = Number(s.value); render(); persist(); });
    props.append(field("字号", s));
  }
  if (el.type === "label") {
    const a = document.createElement("select");
    for (const v of [["left","左对齐"],["center","居中"],["right","右对齐"]]) {
      const o = document.createElement("option"); o.value = v[0]; o.textContent = v[1];
      if (v[0] === el.align) o.selected = true;
      a.append(o);
    }
    a.addEventListener("change", () => { el.align = a.value; render(); persist(); });
    props.append(field("对齐", a));
  }
  if (el.type !== "label") props.append(field("填充", inputColor(el.color, v => { el.color = v; render(); persist(); })));
  if (el.type !== "label" && el.type !== "button" && el.type !== "board") props.append(field("边框", inputColor(el.border, v => { el.border = v; render(); persist(); })));
  if (el.type === "button" || el.type === "label" || el.type === "icon") props.append(field("文字色", inputColor(el.textColor, v => { el.textColor = v; render(); persist(); })));

  const row = document.createElement("div");
  row.className = "row";
  const b1 = document.createElement("button"); b1.textContent = "复制"; b1.onclick = () => duplicate();
  const b2 = document.createElement("button"); b2.textContent = "居中 H"; b2.title = "在当前宽度里水平居中"; b2.onclick = () => { snapshot(); el.x = Math.round((W - el.w) / 2); render(); refreshProps(true); persist(); };
  const b3 = document.createElement("button"); b3.textContent = "删除"; b3.onclick = () => removeSelected();
  row.append(b1, b2, b3);
  props.append(row);
}

function refreshLayers(rebuild) {
  if (!rebuild && layers.contains(document.activeElement)) return;
  layers.textContent = "";
  for (let i = state.elements.length - 1; i >= 0; i--) {
    const el = state.elements[i];
    const li = document.createElement("li");
    if (el.id === state.selected) li.className = "sel";
    li.addEventListener("click", () => select(el.id));
    const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = NAMES[el.type] || el.type;
    const nm = document.createElement("span"); nm.className = "nm";
    nm.textContent = el.name || el.text || (NAMES[el.type] + " " + el.id);
    const z = document.createElement("span"); z.className = "z";
    const up = document.createElement("button"); up.textContent = "↑"; up.title = "上移一层";
    up.onclick = e => { e.stopPropagation(); snapshot(); moveZ(i, +1); };
    const dn = document.createElement("button"); dn.textContent = "↓"; dn.title = "下移一层";
    dn.onclick = e => { e.stopPropagation(); snapshot(); moveZ(i, -1); };
    z.append(up, dn);
    li.append(tag, nm, z);
    layers.append(li);
  }
}

function moveZ(index, dir) {
  const j = index + dir;
  if (j < 0 || j >= state.elements.length) return;
  const [el] = state.elements.splice(index, 1);
  state.elements.splice(j, 0, el);
  render(); refreshLayers(true); persist();
}

/* ---------- 增删 ---------- */
function addElement(type) {
  snapshot();
  const t = TYPES[type];
  const el = Object.assign({ id: uid(), type, name: "", x: Math.round((W - t.w) / 2), y: Math.round((H - t.h) / 2) }, clone(t));
  if (type === "button") el.text = "按钮";
  state.elements.push(el);
  select(el.id);
  persist();
}
function duplicate() {
  const el = byId(state.selected);
  if (!el) return;
  snapshot();
  const copy = clone(el);
  copy.id = uid(); copy.x += 8; copy.y += 8; copy.name = (el.name || "") + "_copy";
  state.elements.push(copy);
  select(copy.id);
  persist();
}
function removeSelected() {
  if (!state.selected) return;
  snapshot();
  state.elements = state.elements.filter(e => e.id !== state.selected);
  state.selected = null;
  refreshProps(true); refreshLayers(true); render(); persist();
}

document.querySelectorAll("[data-add]").forEach(b => b.addEventListener("click", () => addElement(b.dataset.add)));

/* ---------- 键盘 ---------- */
window.addEventListener("keydown", ev => {
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  const typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "z") {
    ev.preventDefault();
    if (ev.shiftKey) redo(); else undo();
    return;
  }
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "d") { ev.preventDefault(); duplicate(); return; }
  if (typing) return;
  const el = byId(state.selected);
  if (!el) return;
  if (ev.key === "Delete" || ev.key === "Backspace") { ev.preventDefault(); removeSelected(); return; }
  if (ev.key === "Escape") { select(null); return; }
  const step = ev.shiftKey ? 10 : 1;
  const map = { ArrowLeft: [-step,0], ArrowRight: [step,0], ArrowUp: [0,-step], ArrowDown: [0,step] };
  if (map[ev.key]) {
    ev.preventDefault();
    if (!drag) snapshot();
    el.x += map[ev.key][0]; el.y += map[ev.key][1];
    render(); refreshProps(false); persist();
  }
});

/* ---------- 撤销 / 重做 ---------- */
function undo() {
  if (!history.length) return;
  future.push(JSON.stringify(state));
  state = JSON.parse(history.pop());
  state.seq = state.seq || 1;
  refreshProps(true); refreshLayers(true); render(); persist();
}
function redo() {
  if (!future.length) return;
  history.push(JSON.stringify(state));
  state = JSON.parse(future.pop());
  refreshProps(true); refreshLayers(true); render(); persist();
}

/* ---------- 存储 ---------- */
let persistTimer = null;
function persist() {
  clearTimeout(persistTimer);
  persistTimer = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }, 250);
}
function restore() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!s || !Array.isArray(s.elements)) return false;
    state = Object.assign({ zoom: 2, snap: true, grid: true, bg: false, seq: 1 }, s);
    state.selected = null;
    return true;
  } catch (e) { return false; }
}

/* ---------- 导出 ---------- */
function download(name, blob) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

document.getElementById("png").onclick = () => {
  const S = 3;
  const c = document.createElement("canvas");
  c.width = W * S; c.height = H * S;
  const g = c.getContext("2d");
  g.fillStyle = "#00000000";
  g.clearRect(0, 0, c.width, c.height);
  drawScene(g, S, { grid: false, selection: false, guides: false });
  c.toBlob(b => download("gui-480x270.png", b), "image/png");
};

function rustCode() {
  const lines = [];
  lines.push("// 由 Horizon GUI 编辑器导出（设计尺寸 480×270 GUI 像素）");
  lines.push("// 面板底与装饰用 draw：draw.fill / draw.text / draw.sprite / draw.gui_nine_slice");
  lines.push("// 可交互按钮用 Widgets：ui.add_button(Button::new(...)) → WidgetId");
  lines.push("");
  for (const el of state.elements) {
    const rect = "[" + [el.x, el.y, el.w, el.h].map(v => Math.round(v) + ".0").join(", ") + "]";
    const name = (el.name || (el.type + "_" + el.id)).replace(/[^A-Za-z0-9_]/g, "_");
    if (el.type === "button") {
      lines.push("let " + name + " = ui.add_button(Button::new(" + rect + ", Text::literal(" + JSON.stringify(el.text || "") + ")));");
    } else if (el.type === "label") {
      lines.push("draw.text(" + JSON.stringify(el.text || "") + ", [" + Math.round(el.x) + ".0, " + Math.round(el.y) + ".0], " + argb(el.textColor) + ", false); // " + Math.round(el.w) + "×" + Math.round(el.h));
    } else if (el.type === "panel") {
      lines.push("draw.fill(" + rect + ", " + argb(el.color) + "); // 面板/底");
    } else if (el.type === "swatch") {
      lines.push("draw.fill(" + rect + ", " + argb(el.color) + "); // 色块");
      lines.push("draw.fill([" + Math.round(el.x) + ".0, " + Math.round(el.y) + ".0, " + Math.round(el.w) + ".0, 1.0], " + argb(el.border) + "); // 选中描边（示意）");
    } else if (el.type === "board") {
      lines.push("draw.fill(" + rect + ", " + argb(el.color) + "); // 画板底色");
      lines.push("// 画板网格与像素：见 draw_paint / runs()");
    } else if (el.type === "icon") {
      lines.push("// 图标格 " + rect + "：draw.item(item, [x+4, y+4], w-8) 或 draw.sprite(...)");
    }
    lines.push("");
  }
  return lines.join("\n");
}

const dlg = document.getElementById("codeDlg");
document.getElementById("rust").onclick = () => {
  const ta = document.getElementById("code");
  ta.value = rustCode();
  ta.scrollTop = 0;
  ta.setSelectionRange(0, 0);
  dlg.showModal();
};
document.getElementById("closeDlg").onclick = () => dlg.close();
document.getElementById("copy").onclick = async () => {
  const ta = document.getElementById("code");
  try { await navigator.clipboard.writeText(ta.value); }
  catch (e) { ta.select(); document.execCommand("copy"); }
  const b = document.getElementById("copy");
  b.textContent = "已复制";
  setTimeout(() => b.textContent = "复制", 900);
};

document.getElementById("save").onclick = () => {
  download("gui-layout.json", new Blob([JSON.stringify(state, null, 2)], { type: "application/json" }));
};
document.getElementById("load").onclick = () => document.getElementById("file").click();
document.getElementById("file").onchange = ev => {
  const f = ev.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const s = JSON.parse(r.result);
      if (!s || !Array.isArray(s.elements)) throw new Error("bad");
      snapshot();
      state = Object.assign({ zoom: 2, snap: true, grid: true, bg: false, seq: 1 }, s);
      state.selected = null;
      refreshProps(true); refreshLayers(true); render(); persist();
    } catch (e) { alert("不是有效的布局文件"); }
  };
  r.readAsText(f);
  ev.target.value = "";
};
document.getElementById("clear").onclick = () => {
  if (!confirm("清空所有控件？")) return;
  snapshot();
  state.elements = []; state.selected = null;
  refreshProps(true); refreshLayers(true); render(); persist();
};

/* ---------- 缩放 / 网格 ---------- */
document.getElementById("zoom").onchange = ev => { state.zoom = Number(ev.target.value); resizeCanvas(); persist(); };
document.getElementById("snap").onchange = ev => { state.snap = ev.target.checked; persist(); };
document.getElementById("grid").onchange = ev => { state.grid = ev.target.checked; render(); persist(); };
document.getElementById("undo").onclick = undo;
document.getElementById("redo").onclick = redo;

/* ---------- 初始示例 ---------- */

    mk("label", 160, 117, 114, 18, { text: "1×1×1", size: 16, textColor: "#FFE97F", align: "right" }),
    mk("button", 284, 111, 22, 22, { text: "−", name: "minus" }),
    mk("button", 312, 111, 22, 22, { text: "+", name: "plus" }),

  ];
}

/* ---------- 自检（?selftest） ---------- */
if (location.search.indexOf("selftest") >= 0) {
  const out = [];
  const ok = (name, cond) => out.push((cond ? "PASS " : "FAIL ") + name);
  ok("argb", argb("#8B8B8B") === "0xFF8B8B8B");
  ok("rgba transparent", rgba("#00000000") === null);
  ok("rgba half", rgba("#80102030") === "rgba(16,32,48,0.502)");
  const a = { id: "t1", type: "label", x: 100, y: 50, w: 40, h: 20 };
  const b = { id: "t2", type: "label", x: 200, y: 90, w: 40, h: 20 };
  state.elements = [a, b];
  const sn = snapEdges(a, 197, 87, { x: 197, y: 87 });
  ok("snap x to 200", Math.round(sn.x) === 200);
  ok("snap y to 90", Math.round(sn.y) === 90);
  ok("snap guides", sn.guides.length >= 1);
  state.elements = [a, b];
  ok("hit element", hitElement(110, 60) === a);
  ok("hit empty", hitElement(400, 250) === null);
  const hs = handles(a);
  ok("handles 8", hs.length === 8);
  state.elements = [a];
  state.selected = null;
  const before = state.elements.length;
  addElement("button");
  ok("add button", state.elements.length === before + 1);
  ok("added selected", !!byId(state.selected));
  state.elements = [
    { id: "u1", type: "button", name: "ok_btn", x: 10, y: 20, w: 84, h: 22, text: "确定", color: "#8B8B8B", border: "#E6E6E6", textColor: "#FFFFFF", size: 16, align: "center" },
    { id: "u2", type: "panel", x: 0, y: 0, w: 200, h: 100, color: "#101010", border: "#303030", text: "", textColor: "#FFFFFF", size: 16, align: "left" }
  ];
  const code = rustCode();
  ok("rust button", code.indexOf("let ok_btn = ui.add_button(Button::new([10.0, 20.0, 84.0, 22.0]") === 0 || code.indexOf("add_button(Button::new([10.0, 20.0, 84.0, 22.0]") > 0);
  ok("rust fill", code.indexOf("draw.fill([0.0, 0.0, 200.0, 100.0], 0xFF101010)") > 0);

  // 交互自检：模拟真实 pointer 事件走完 选中 → 拖动 → 缩放
  state.elements = [{ id: "d1", type: "button", name: "drag", x: 40, y: 40, w: 84, h: 22,
    text: "拖", color: "#8B8B8B", border: "#E6E6E6", textColor: "#FFFFFF", size: 16, align: "center" }];
  state.selected = null;
  const box = cv.getBoundingClientRect();
  const at = (x, y) => ({ clientX: box.left + x * state.zoom, clientY: box.top + y * state.zoom,
    bubbles: true, pointerId: 1, isPrimary: true, button: 0 });
  const fire = (type, x, y) => cv.dispatchEvent(new PointerEvent(type, at(x, y)));
  fire("pointerdown", 60, 50);
  ok("pointer selects", state.selected === "d1");
  fire("pointermove", 90, 70);
  fire("pointerup", 90, 70);
  const d1 = byId("d1");
  ok("drag moves", !!d1 && d1.x === 70 && d1.y === 60);
  fire("pointerdown", 70 + 84, 60 + 22);
  fire("pointermove", 70 + 84 + 10, 60 + 22 + 6);
  fire("pointerup", 70 + 94, 60 + 28);
  ok("resize grows", !!d1 && d1.w === 94 && d1.h === 28);
  ok("undo restores", (() => { undo(); const u = byId("d1"); return !!u && u.w === 84; })());
  const pre = document.createElement("div");
  pre.id = "selftest";
  pre.style.cssText = "position:fixed;left:0;top:0;z-index:9999;background:#fff;color:#000;font:18px/1.5 Consolas,monospace;padding:12px 16px;white-space:pre;margin:0;";
  pre.textContent = out.join("\n");
  document.body.appendChild(pre);
}

/* ---------- 启动 ---------- */
if (!restore()) demo();
document.getElementById("zoom").value = String(state.zoom);
document.getElementById("snap").checked = !!state.snap;
document.getElementById("grid").checked = !!state.grid;
resizeCanvas();
refreshProps(true);
refreshLayers(true);

/* ?code=1 直接打开 Rust 导出窗（方便核对导出内容） */
if (/[?&]code=1/.test(location.search)) document.getElementById("rust").click();

/* ?sel=N 预选第 N 个控件（方便截图核对属性面板） */
(() => {
  const m = /[?&]sel=(\d+)/.exec(location.search);
  if (!m) return;
  const target = state.elements[Math.min(parseInt(m[1], 10) || 0, state.elements.length - 1)];
  if (target) select(target.id);
})();
